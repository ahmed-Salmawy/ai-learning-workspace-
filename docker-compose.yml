services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file:
      - backend/.env
    environment:
      # inside the compose network the DB is the `db` service, not localhost
      ALW_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/postgres
      ALW_CORS_ORIGINS: http://localhost:3100,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      # browser calls the backend directly; keep host-reachable URL
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_WORKSPACE_ID: 00000000-0000-0000-0000-000000000001
    ports:
      - "3100:3000"
    depends_on:
      - backend

volumes:
  pgdata:
